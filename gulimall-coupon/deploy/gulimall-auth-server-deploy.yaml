kind: Deployment
apiVersion: apps/v1
metadata:
  name: gulimall-coupon
  namespace: gulimall
  labels:
    app: gulimall-coupon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gulimall-coupon
  template:
    metadata:
      labels:
        app: gulimall-coupon
    spec:
      containers:
        - name: gulimall-coupon
          image: $REGISTRY/$DOCKERHUB_NAMESPACE/$PROJECT_NAME:$PROJECT_VERSIN
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 10m
              memory: 10Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
kind: Service
apiVersion: v1
metadata:
  name: gulimall-coupon
  namespace: gulimall
  labels:
    app: gulimall-coupon
spec:
  ports:
    - name: http-8080
      protocol: TCP
      port: 8333
      targetPort: 8858
      nodePort: 20005
  selector:
    app: gulimall-coupon
  type: NodePort
  sessionAffinity: None